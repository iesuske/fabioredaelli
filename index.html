<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author</title>
    
    <!-- Importazione font stile fumetto/retro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

    <style>
        /* Reset di base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #fdebd0; /* Colore crema/beige di sfondo */
            /* RISOLUZIONE PROBLEMA 2: Elimina lo scroll orizzontale e lo spazio vuoto a destra */
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header con barra rossa */
        header {
            background-color: #a93226; /* Rosso scuro */
            border-bottom: 5px solid #000; /* Riga nera inferiore */
            text-align: center;
            padding-top: 25px;
            /* RISOLUZIONE PROBLEMA 1: Padding in basso calibrato per far appoggiare il testo alla riga nera senza tagliarlo */
            padding-bottom: 5px; 
            position: relative;
        }

        h1 {
            font-family: 'Bangers', cursive; /* Font stile fumetto */
            color: #fff;
            font-size: 4.5rem;
            letter-spacing: 2px;
            /* Contorno nero per il testo */
            text-shadow: 
                3px 3px 0 #000,
                -1px -1px 0 #000,  
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
            margin: 0;
            line-height: 1;
            /* Posizionamento "filo" della riga nera */
            position: relative;
            bottom: -2px; 
        }

        /* Sezione navigazione/menu */
        .menu-section {
            display: flex;
            justify-content: space-between;
            padding: 30px 50px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-section h2 {
            font-family: 'Dancing Script', cursive;
            color: #fff;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            text-decoration: none;
        }

        /* Contenuto principale con immagine */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .comic-image {
            /* Assicura che l'immagine non causi overflow */
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Sezioni About e Contact (nascoste di default, visibili se usate come ancore) */
        .content-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .content-section h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social-links a {
            text-decoration: none;
            color: #a93226;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid #a93226;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background-color: #a93226;
            color: #fff;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #555;
            margin-top: auto;
        }

        /* Responsive per mobile */
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
            .menu-section {
                padding: 20px;
            }
            .menu-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Fabio Hot Stuff Redaelli</h1>
    </header>

    <div class="menu-section">
        <h2>About Me</h2>
        <h2>Contact Me</h2>
    </div>

    <main>
        <!-- Sostituisci 'comic-car.png' con il nome esatto del tuo file immagine -->
        <img src="comic-car.png" alt="Fabio Redaelli Comic Artist" class="comic-image">
    </main>

    <!-- Sezione About Me -->
    <section id="about" class="content-section">
        <h3>Sono Fabio Redaelli</h3>
        <p>Comic Art Author</p>
    </section>

    <!-- Sezione Contact Me -->
    <section id="contact" class="content-section">
        <h3>Contattami</h3>
        <div class="social-links">
            <a href="#instagram">Instagram</a>
            <a href="#facebook">Facebook</a>
            <a href="#telegram">Telegram</a>
            <a href="#whatsapp">WhatsApp</a>
        </div>
    </section>

    <footer>
        <p>Copyright 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>
