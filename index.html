<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        /* SFONDO E PAGINA BLOCCATA SENZA SCROLL */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; 
            background-color: #fde3b8; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* CONTENITORE PRINCIPALE (ORIGINALE 100%) */
        .master-canvas {
            position: relative;
            width: 100%;
            background-color: #fde3b8;
        }

        .bg-image {
            width: 100%;
            height: auto;
            display: block; 
        }

        .text-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            pointer-events: none; 
        }

        /* =======================================================
           [BLINDATO 1/2] TITOLO HEADER - NON MODIFICARE PER NESSUN MOTIVO
           ======================================================= */
        .header-anchor {
            position: absolute;
            top: 7.6%; 
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: auto; 
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.8vw; 
            line-height: 1;
            white-space: nowrap; 
            margin: 0;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        /* =======================================================
           [BLINDATO 2/2] POSIZIONE MENU (DESTRA) - NON MODIFICARE
           ======================================================= */
        .menus-container {
            display: flex;
            gap: 3.5vw;
            margin-left: 58%;
            margin-top: 0.8vw; 
        }

        /* STILI DROPDOWN (CONTENUTI E COLORI) */
        .dropdown {
            position: relative;
        }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            font-size: 2vw; 
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.5);
            transition: color 0.2s ease;
        }

        .dropdown:hover .dropdown-trigger { color: #000000; }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            margin-top: 0.5vw;
            background: #000000;
            border-radius: 12px;
            list-style: none;
            padding: 0;
            z-index: 100;
            min-width: 200px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .menu-about { left: 0; text-align: left; }
        .menu-contact { right: 0; text-align: right; }

        .dropdown:hover .dropdown-menu { display: block; }

        .dropdown-menu li a {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff;
            padding: 10px 18px;
            display: block;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .dropdown-menu li a:hover { 
            background: #b72216; 
            border-radius: 12px;
        }

        /* FOOTER SOTTILE E DISCRETO FIXATO IN BASSO */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 5px 10px;
            text-align: center;
            background: rgba(13, 27, 42, 1);
            color: white;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <div class="master-canvas">
        <img src="images/bg2.jpg" class="bg-image" alt="Artwork Fabio Redaelli">
        <div class="text-layer">
            <div class="header-anchor">
                <h1 class="brand-title">
                    <span class="text-white">Fabio</span> <span class="text-black">Hot Stuff</span> <span class="text-white">Redaelli</span>
                </h1>
                
                <div class="menus-container">
                    <div class="dropdown">
                        <a class="dropdown-trigger">About Me</a>
                        <ul class="dropdown-menu menu-about">
                            <li><a href="#about">Sono Fabio Redaelli</a></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <a class="dropdown-trigger">Contact Me</a>
                        <ul class="dropdown-menu menu-contact">
                            <li><a href="#instagram">Instagram</a></li>
                            <li><a href="#facebook">Facebook</a></li>
                            <li><a href="#telegram">Telegram</a></li>
                            <li><a href="#whatsapp">WhatsApp</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Copyright &copy; 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>
