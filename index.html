<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* SFONDO UNICO GENERALE */
        body {
            background-color: #fde3b8;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* FASCIA ROSSA CREATA IN CSS (Altezza fissa e riga nera integrata) */
        .red-banner {
            width: 100%;
            background-color: #b72216;
            padding: 25px 0 15px 0;
            text-align: center;
            border-bottom: 3px solid #000000; /* Riga nera perfetta sotto la scritta */
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1;
            margin: 0;
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        /* MENU AGGANCIATO ALLA FASCIA ROSSA */
        .menus-container {
            display: flex;
            justify-content: space-between;
            width: 70%;
            margin: 15px auto 0 auto;
        }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            color: #ffffff;
            cursor: pointer;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.5);
        }

        /* CONTENITORE IMMAGINE SOTTOSTANTE */
        .artwork-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: block;
        }

        .artwork-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Fascia Rossa in CSS Puro -->
    <div class="red-banner">
        <h1 class="brand-title">
            <span class="text-white">Fabio</span> 
            <span class="text-black">Hot Stuff</span> 
            <span class="text-white">Redaelli</span>
        </h1>
        
        <div class="menus-container">
            <span class="dropdown-trigger">About Me</span>
            <span class="dropdown-trigger">Contact Me</span>
        </div>
    </div>

    <!-- Immagine dell'Auto / Disegno sotto -->
    <div class="artwork-container">
        <img src="images/bg2.jpg" alt="Artwork Fabio Redaelli">
    </div>

</body>
</html>
