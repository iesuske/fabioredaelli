<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito Desktop</title>
    <style>
        /* Reset e stili base desktop */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Navigazione Desktop */
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            padding: 12px 24px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        /* Pulsante / Link WORKS - Stato Normale */
        .btn-works {
            color: #ffffff;
            border: 2px solid #ff0000; /* Cornice rossa di base */
            background-color: transparent;
            cursor: pointer;
        }

        /* Pulsante / Link WORKS - Stato HOVER (Inversione Colori) */
        .btn-works:hover {
            color: #ff0000 !important;        /* Testo diventa Rosso */
            border-color: #ffffff !important; /* Cornice diventa Bianca */
            background-color: transparent;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link btn-works">Works</a>
            <a href="#" class="nav-link">About</a>
            <a href="#" class="nav-link">Contact</a>
        </nav>
    </header>

</body>
</html>
