<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sezione Ricambi</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Banda rossa principale con padding superiore ridotto */
        .banda-rossa {
            background-color: #e60000; /* Rosso vivace */
            width: 100%;
            padding: 10px 0 20px 0; /* Ridotto lo spazio in alto per sollevare il blocco */
            text-align: center;
        }

        /* Contenitore per gestire la scritta e la riga */
        .contenitore-titolo {
            display: inline-block;
            position: relative;
            padding-bottom: 6px; /* Spazio per la riga nera */
        }

        /* Stile della scritta Ricambi */
        .scritta-ricambi {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0;
            letter-spacing: 2px;
        }

        /* La riga nera che sorregge la scritta */
        .riga-nera {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px; /* Spessore della riga */
            background-color: #000000; /* Nero pieno */
        }
    </style>
</head>
<body>

    <!-- Inizio Banda Rossa con Scritta e Riga Nera -->
    <div class="banda-rossa">
        <div class="contenitore-titolo">
            <h2 class="scritta-ricambi">Ricambi</h2>
            <div class="riga-nera"></div>
        </div>
    </div>

</body>
</html>
