<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            background-color: #fceecb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 1. IL CONTENITORE CANVAS: Tiene tutto unito */
        .master-canvas {
            position: relative;
            width: 100%;
            overflow: hidden; /* Evita qualsiasi sbavatura laterale */
        }

        /* 2. L'IMMAGINE: Detta le dimensioni del contenitore */
        .bg-image {
            width: 100%;
            height: auto;
            display: block; /* Rimuove spazi vuoti sotto l'immagine */
        }

        /* 3. IL LIVELLO TESTI: Si sovrappone perfettamente all'immagine */
        .text-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            pointer-events: none; /* Lascia cliccare l'immagine sotto, tranne che sui menu */
        }

        /* 4. ANCORAGGIO ALLA FASCIA ROSSA */
        .header-anchor {
            position: absolute;
            /* ATTENZIONE: Regola questo valore (es. 8%, 9%, 10%) per centrare 
               il testo perfettamente al centro della tua fascia rossa specifica */
            top: 8.5%; 
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: auto; /* Riattiva il click per i menu */
        }

        /* Il testo usa i 'vw' per crescere e decrescere in perfetta proporzione con l'immagine */
        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.8vw; 
            line-height: 1;
            white-space: nowrap;
            margin: 0;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        /* 5. MENU INCOLLATI SOTTO IL TITOLO */
        .menus-container {
            display: flex;
            justify-content: space-between;
            width: 70%; /* Allarga o stringi per avvicinare/allontanare i menu tra loro */
            margin: 0 auto;
            margin-top: 1.2vw; /* Distanza proporzionale sotto il titolo */
        }

        .dropdown {
            position: relative;
        }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            font-size: 2vw; /* Dimensione proporzionale */
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.5);
            transition: color 0.2s ease;
        }

        .dropdown:hover .dropdown-trigger { color: #000000; }

        /* Le tendine che si aprono al passaggio del mouse */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            margin-top: 1vw;
            background: #000000;
            border-radius: 12px;
            list-style: none;
            padding: 0;
            z-index: 100;
            min-width: 220px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .menu-about { left: 0; text-align: left; }
        .menu-contact { right: 0; text-align: right; }

        .dropdown:hover .dropdown-menu { display: block; }

        /* Il testo dentro la tendina non usa vw, resta leggibile a grandezza fissa */
        .dropdown-menu li a {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .dropdown-menu li a:hover { 
            background: #b72216; 
            border-radius: 12px;
        }

        /* 6. FOOTER */
        footer {
            padding: 20px;
            text-align: center;
            background: rgba(13, 27, 42, 0.9);
            color: white;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- CONTENITORE ASSOLUTO -->
    <div class="master-canvas">
        
        <!-- L'IMMAGINE REALE (Ora comanda lei le dimensioni della pagina) -->
        <img src="images/bg2.jpg" class="bg-image" alt="Artwork Fabio Redaelli">

        <!-- IL TESTO (Incollato e proporzionale all'immagine) -->
        <div class="text-layer">
            <div class="header-anchor">
                
                <h1 class="brand-title">
                    <span class="text-white">Fabio</span> <span class="text-black">Hot Stuff</span> <span class="text-white">Redaelli</span>
                </h1>
                
                <div class="menus-container">
                    <div class="dropdown">
                        <a class="dropdown-trigger">About Me</a>
                        <ul class="dropdown-menu menu-about">
                            <li><a href="#about">Sono Fabio Redaelli</a></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <a class="dropdown-trigger">Contact Me</a>
                        <ul class="dropdown-menu menu-contact">
                            <li><a href="#instagram">Instagram</a></li>
                            <li><a href="#facebook">Facebook</a></li>
                            <li><a href="#telegram">Telegram</a></li>
                            <li><a href="#whatsapp">WhatsApp</a></li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer>
        <p>Copyright 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>
