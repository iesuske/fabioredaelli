<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fceecb;
        }

        .bg-artwork {
            position: absolute;
            inset: 0;
            background-image: url('images/bg2.jpg');
            background-size: cover;
            background-position: center 18%; 
            background-repeat: no-repeat;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }

        header {
            width: 100%;
            margin-top: 52px; 
            padding: 0 4%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.28rem;
            text-align: center;
            white-space: nowrap;
            line-height: 1.2;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
            transform: translateY(33px); 
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        .sub-nav {
            width: 100%;
            padding: 0 4%;
            margin-top: 42px; /* Ripristinato margine verticale */
            display: flex; justify-content: flex-end; 
            gap: calc(3cm - 8px); /* Avvicinati in orizzontale di 8px */
            pointer-events: auto;
        }

        .dropdown { position: relative; display: inline-block; }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            font-size: 1.7rem; /* Ripristinato font originale */
            text-decoration: none; cursor: pointer;
            padding: 10px 15px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .contact-trigger { font-size: 1.6rem; }

        .dropdown:hover .dropdown-trigger { color: #b72216; }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 50%; transform: translateX(50%); 
            top: 100%; margin-top: 2px; 
            background: #000000; 
            box-shadow: 0px 12px 32px rgba(0,0,0,0.55);
            border-radius: 20px; 
            border: none;
            list-style: none;
            padding: 0; 
            z-index: 10;
            overflow: hidden; 
        }

        .menu-about { min-width: 245px; }
        .menu-contact { min-width: 150px; } 

        .dropdown-menu li { width: 100%; }

        .dropdown-menu li a {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            padding: 8px 15px; 
            text-decoration: none;
            display: block;
            width: 100%;
            font-size: 1.3rem; 
            text-align: center; 
            transition: background-color 0.1s ease;
        }

        .dropdown-menu li a:hover {
            background: #b72216;
            color: #ffffff;
        }

        .dropdown:hover .dropdown-menu { display: block; }

        main { flex-grow: 1; pointer-events: none; }

        footer {
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem; pointer-events: auto;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(4px);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* =====================================================
           RESPONSIVE OVERRIDES — iPad / tablet (≤1024px)
           Il layout desktop sopra resta invariato: qui si
           sovrascrivono solo le proprietà che rompono il layout
           su viewport stretti (nowrap, gap in cm, margini fissi).
           ===================================================== */
        @media (max-width: 1024px) {
            .brand-title {
                font-size: 2.6rem;
                transform: translateY(20px);
            }

            .sub-nav {
                gap: 40px;
                margin-top: 30px;
            }

            header { margin-top: 36px; }
        }

        /* =====================================================
           RESPONSIVE OVERRIDES — iPhone / mobile (≤480px)
           ===================================================== */
        @media (max-width: 480px) {
            /* Blocca l'intero hero a UNA sola schermata: niente scroll,
               niente body più alto del viewport → lo sfondo (bg-artwork,
               absolute/inset:0) resta vincolato a 100dvh invece di
               "spalmarsi" su più schermate di scroll. */
            html, body {
                height: 100vh;      /* fallback iOS < 15.4 */
                height: 100dvh;
                overflow: hidden;
                overflow-x: hidden;
            }

            .bg-artwork {
                background-size: cover;
                background-position: center 8%;  /* mostra titolo + inizio auto, non tutta la scena */
            }

            .content-overlay {
                height: 100vh;
                height: 100dvh;
            }

            header {
                margin-top: 16px;
                padding: 0 4%;
            }

            .brand-title {
                font-size: 1.45rem;
                white-space: normal;      /* niente più overflow orizzontale */
                line-height: 1.2;
                transform: translateY(6px);
            }

            .sub-nav {
                margin-top: 10px;
                gap: 20px;                 /* niente più calc(3cm - 8px) */
                justify-content: center;   /* centrato invece di flex-end: più leggibile su schermi stretti */
                flex-wrap: wrap;
                padding: 0 4%;
            }

            .dropdown-trigger {
                font-size: 1.05rem;
                padding: 5px 8px;
            }

            .contact-trigger { font-size: 1rem; }

            .dropdown-menu {
                min-width: 190px;
                max-width: 90vw;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
            }

            .menu-about { min-width: 170px; }
            .menu-contact { min-width: 130px; }

            .dropdown-menu li a {
                font-size: 1rem;
                padding: 10px 12px;       /* target touch più grande */
            }

            footer {
                font-size: 0.68rem;
                padding: 8px 10px;
                line-height: 1.3;
            }
        }

        @media (max-width: 360px) {
            .brand-title { font-size: 1.35rem; }
            .sub-nav { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <h1 class="brand-title">
                <span class="text-white">Fabio</span>&nbsp;<span class="text-black">Hot Stuff</span>&nbsp;<span class="text-white">Redaelli</span>
            </h1>
        </header>

        <div class="sub-nav">
            <div class="dropdown">
                <a class="dropdown-trigger">About Me</a>
                <ul class="dropdown-menu menu-about">
                    <li><a href="#about">Sono Fabio Redaelli,<br>appassionato di Rock’n’Roll e arte</a></li>
                </ul>
            </div>

            <div class="dropdown">
                <a class="dropdown-trigger contact-trigger">Contact Me</a>
                <ul class="dropdown-menu menu-contact">
                    <li><a href="#instagram">Instagram</a></li>
                    <li><a href="#facebook">Facebook</a></li>
                    <li><a href="#telegram">Telegram</a></li>
                    <li><a href="#whatsapp">WhatsApp</a></li>
                </ul>
            </div>
        </div>
        <main></main>
        <footer>
            <p>Copyright 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
