<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; background-color: #fceecb; }

        /* --- VERSIONE DESKTOP ORIGINALE --- */
        .bg-artwork { position: absolute; inset: 0; background-image: url('images/bg2.jpg'); background-size: cover; background-position: center 18%; background-repeat: no-repeat; z-index: 1; }
        .content-overlay { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        header { width: 100%; margin-top: 52px; padding: 0 4%; display: flex; justify-content: center; }
        .brand-title { font-family: 'Lobster Regular', cursive; font-size: 3.28rem; text-align: center; white-space: nowrap; text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2); transform: translateY(33px); }
        .sub-nav { width: 100%; padding: 0 4%; margin-top: 42px; display: flex; justify-content: flex-end; gap: calc(3cm - 8px); }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-trigger { font-family: 'Lobster Regular', cursive; color: #ffffff; font-size: 1.7rem; cursor: pointer; padding: 10px 15px; text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4); }
        .contact-trigger { font-size: 1.6rem; }
        .dropdown-menu { display: none; position: absolute; right: 50%; transform: translateX(50%); top: 100%; margin-top: 2px; background: #000000; box-shadow: 0px 12px 32px rgba(0,0,0,0.55); border-radius: 20px; list-style: none; padding: 0; z-index: 10; overflow: hidden; }
        .menu-about { min-width: 245px; }
        .menu-contact { min-width: 150px; }
        .dropdown-menu li a { font-family: 'Lobster Regular', cursive; color: #ffffff; padding: 8px 15px; display: block; font-size: 1.3rem; text-align: center; }
        .dropdown:hover .dropdown-menu { display: block; }
        footer { padding: 15px; text-align: center; color: rgba(255, 255, 255, 0.9); font-size: 0.85rem; background: rgba(13, 27, 42, 0.6); backdrop-filter: blur(4px); }

        /* --- CORREZIONI SOLO PER MOBILE (iPhone) --- */
        @media (max-width: 768px) {
            .bg-artwork { background-size: contain; background-position: center center; }
            .brand-title { font-size: 2rem; transform: translateY(10px); }
            .sub-nav { justify-content: center; margin-top: 20px; gap: 10px; }
            footer { font-size: 0.6rem; padding: 5px; }
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <h1 class="brand-title">
                <span style="color:#ffffff;">Fabio</span>&nbsp;<span style="color:#000000;">Hot Stuff</span>&nbsp;<span style="color:#ffffff;">Redaelli</span>
            </h1>
        </header>

        <div class="sub-nav">
            <div class="dropdown">
                <a class="dropdown-trigger">About Me</a>
                <ul class="dropdown-menu menu-about">
                    <li><a href="#about">Sono Fabio Redaelli</a></li>
                </ul>
            </div>
            <div class="dropdown">
                <a class="dropdown-trigger contact-trigger">Contact Me</a>
                <ul class="dropdown-menu menu-contact">
                    <li><a href="#instagram">Instagram</a></li>
                    <li><a href="#facebook">Facebook</a></li>
                </ul>
            </div>
        </div>
        <footer>
            <p>© 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
