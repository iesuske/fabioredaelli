<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
        }

        .master-canvas {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Layout base per Desktop */
        .header-anchor {
            position: absolute;
            top: 6%;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #e50914; /* Banda rossa */
            border-bottom: 3px solid #000000; /* Righina nera */
            display: flex;
            align-items: flex-end; /* Appoggia il contenuto esattamente sulla linea */
            justify-content: center;
            padding-bottom: 2px;
            z-index: 10;
        }

        .brand-title {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            line-height: 1;
            margin: 0;
            padding: 0;
            text-align: center;
            white-space: nowrap;
        }

        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .menus-container {
            margin-top: 20px;
            text-align: center;
        }

        .btn-curiosity, .btn-works-style, .dropdown-trigger {
            display: inline-block;
            margin: 5px;
            padding: 8px 16px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }

        /* REGOLAZIONE ESCLUSIVA PER IPAD / TABLET (Copre tutte le risoluzioni da Mini a Pro 12.9") */
        @media screen and (min-width: 768px) and (max-width: 1366px) {
            .master-canvas {
                margin-top: -31px !important;
                overflow: hidden;
            }

            /* Contenitore Banda Rossa + Righina Nera */
            .header-anchor {
                position: absolute !important;
                top: 6% !important;
                left: 0 !important;
                width: 100% !important;
                height: 65px !important;
                background-color: #d32f2f !important; /* Banda rossa */
                border-bottom: 4px solid #000000 !important; /* Righina nera fissa */
                display: flex !important;
                align-items: flex-end !important; /* Mantiene la scritta ancorata in basso */
                justify-content: center !important;
                padding-bottom: 1px !important; /* Garantisce il contatto perfetto con la righina nera */
                box-sizing: border-box !important;
            }

            /* Scritta fissa appoggiata alla righina */
            .brand-title {
                font-size: clamp(20px, 4.2vw, 40px) !important; /* Scala in modo fluido su ogni iPad */
                line-height: 1 !important;
                margin: 0 !important;
                padding: 0 !important;
                transform: none !important; /* Rimuove translateY instabili tra schermi diversi */
                color: #ffffff !important;
                white-space: nowrap !important;
            }

            .bg-image {
                width: 190% !important;
                max-width: none !important;
                margin-left: -45% !important;
                display: block;
            }

            .menus-container {
                margin-top: 35px !important;
            }

            .btn-curiosity, .btn-works-style, .dropdown-trigger:not(.btn-works-style) {
                font-size: 2.1vw !important;
                padding: 2px 10px !important;
            }
        }
    </style>
</head>
<body>

    <div class="master-canvas">
        <!-- Banda rossa con righina nera inferiore e scritta ancorata -->
        <header class="header-anchor">
            <h1 class="brand-title">FABIO HOT STUFF REDAELLI</h1>
        </header>

        <img src="background.jpg" alt="Background" class="bg-image">

        <div class="menus-container">
            <a href="#" class="btn-curiosity">Curiosity</a>
            <a href="#" class="btn-works-style">Works Style</a>
            <a href="#" class="dropdown-trigger">Menu</a>
        </div>
    </div>

</body>
</html>
