<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fceecb;
        }

        .bg-artwork {
            position: absolute;
            inset: 0;
            background-image: url('images/bg2.jpg');
            background-size: cover;
            background-position: center 18%; 
            background-repeat: no-repeat;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }

        header {
            width: 100%;
            margin-top: 45px; 
            padding: 0 4%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
        }

        /* Contenitore bloccato alla larghezza del titolo */
        .header-inner {
            position: relative;
            display: inline-block;
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.9rem;
            text-align: center;
            white-space: nowrap;
            line-height: 1;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
            transform: translateY(39px); /* Abbassato di 5px per adagiare il font esattamente sulla riga nera */
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        /* Menu About Me: agganciato a filo della F di Fabio, va a sinistra */
        .dropdown-about {
            position: absolute;
            top: 100%;
            right: 100%;
            margin-top: 53px;
            margin-right: 0;
            white-space: nowrap;
            pointer-events: auto;
            text-align: right;
        }

        /* Menu Contact Me: agganciato a filo della i di Redaelli, va a destra */
        .dropdown-contact {
            position: absolute;
            top: 100%;
            left: 100%;
            margin-top: 53px;
            margin-left: 0;
            white-space: nowrap;
            pointer-events: auto;
            text-align: left;
        }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            font-size: 2.1rem; 
            text-decoration: none; 
            cursor: pointer;
            padding: 0;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .dropdown:hover .dropdown-trigger { color: #b72216; }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%; margin-top: 6px; 
            background: #000000; 
            box-shadow: 0px 12px 32px rgba(0,0,0,0.55);
            border-radius: 20px; 
            border: none;
            list-style: none;
            padding: 0; 
            z-index: 10;
            overflow: hidden; 
        }

        .menu-about { min-width: 245px; right: 0; }
        .menu-contact { min-width: 150px; left: 0; } 

        .dropdown-menu li { width: 100%; }

        .dropdown-menu li a {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            padding: 8px 15px; 
            text-decoration: none;
            display: block;
            width: 100%;
            font-size: 1.3rem; 
            text-align: center; 
            transition: background-color 0.1s ease;
        }

        .dropdown-menu li a:hover {
            background: #b72216;
            color: #ffffff;
        }

        .dropdown:hover .dropdown-menu { display: block; }

        main { flex-grow: 1; pointer-events: none; }

        footer {
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem; pointer-events: auto;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(4px);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .mobile-hero { display: none; }

        /* Responsive tablet/mobile */
        @media (max-width: 768px) {
            html, body { height: auto; }
            .bg-artwork { display: none; }
            .mobile-hero { display: block; width: 100%; height: auto; }
            .content-overlay { height: auto; min-height: 0; }
            main { flex-grow: 0; }
            .header-inner { display: flex; flex-direction: column; align-items: center; width: 100%; }
            .brand-title { font-size: 2.2rem; transform: translateY(10px); white-space: normal; }
            .dropdown-about, .dropdown-contact {
                position: relative; top: auto; left: auto; right: auto;
                margin: 15px 10px 0 10px; display: inline-block;
            }
            .dropdown-trigger { font-size: 1.3rem; }
            header { margin-top: 20px; }
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <div class="header-inner">
                <h1 class="brand-title">
                    <span class="text-white">Fabio</span>&nbsp;<span class="text-black">Hot Stuff</span>&nbsp;<span class="text-white">Redaelli</span>
                </h1>

                <div class="dropdown dropdown-about">
                    <a class="dropdown-trigger">About Me</a>
                    <ul class="dropdown-menu menu-about">
                        <li><a href="#about">Sono Fabio Redaelli,<br>appassionato di Rock’n’Roll e arte</a></li>
                    </ul>
                </div>

                <div class="dropdown dropdown-contact">
                    <a class="dropdown-trigger">Contact Me</a>
                    <ul class="dropdown-menu menu-contact">
                        <li><a href="#instagram">Instagram</a></li>
                        <li><a href="#facebook">Facebook</a></li>
                        <li><a href="#telegram">Telegram</a></li>
                        <li><a href="#whatsapp">WhatsApp</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <main>
            <img class="mobile-hero" src="images/bg2.jpg" alt="Fabio Redaelli - Comic Artist illustration">
        </main>
        <footer>
            <p>Copyright 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
