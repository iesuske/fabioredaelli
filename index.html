<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fceecb;
        }

        .bg-artwork {
            position: absolute;
            inset: 0;
            background-image: url('images/bg2.jpg');
            background-size: cover;
            background-position: center 18%; 
            background-repeat: no-repeat;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }

        header {
            width: 100%;
            margin-top: 52px; 
            padding: 0 4%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.28rem;
            text-align: center;
            line-height: 1.2;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
            transform: translateY(33px); 
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        .sub-nav {
            width: 100%;
            padding: 0 4%;
            margin-top: 42px;
            display: flex; justify-content: center; /* Centrato per mobile */
            gap: 20px; 
            pointer-events: auto;
        }

        .dropdown { position: relative; display: inline-block; }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            font-size: 1.7rem;
            text-decoration: none; cursor: pointer;
            padding: 10px 15px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .contact-trigger { font-size: 1.6rem; }

        .dropdown:hover .dropdown-trigger { color: #b72216; }

        .dropdown-menu {
            display: none;
            position: absolute;
            left: 50%; transform: translateX(-50%); 
            top: 100%; margin-top: 2px; 
            background: #000000; 
            box-shadow: 0px 12px 32px rgba(0,0,0,0.55);
            border-radius: 20px; 
            border: none;
            list-style: none;
            padding: 0; 
            z-index: 10;
            overflow: hidden; 
        }

        .menu-about { min-width: 200px; }
        .menu-contact { min-width: 150px; } 

        .dropdown-menu li a {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            padding: 10px; 
            text-decoration: none;
            display: block;
            font-size: 1.1rem; 
            text-align: center; 
        }

        .dropdown:hover .dropdown-menu { display: block; }

        main { flex-grow: 1; pointer-events: none; }

        footer {
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.75rem; pointer-events: auto;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        /* --- STILE SPECIFICO PER IPHONE --- */
        @media only screen and (max-width: 600px) {
            .brand-title { font-size: 2.2rem; padding: 0 10px; }
            .sub-nav { gap: 10px; }
            .dropdown-trigger { font-size: 1.3rem; padding: 5px; }
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <h1 class="brand-title">
                <span class="text-white">Fabio</span>&nbsp;<span class="text-black">Hot Stuff</span>&nbsp;<span class="text-white">Redaelli</span>
            </h1>
        </header>

        <div class="sub-nav">
            <div class="dropdown">
                <a class="dropdown-trigger">About Me</a>
                <ul class="dropdown-menu menu-about">
                    <li><a href="#about">Sono Fabio Redaelli, appassionato di Rock’n’Roll e arte</a></li>
                </ul>
            </div>

            <div class="dropdown">
                <a class="dropdown-trigger contact-trigger">Contact Me</a>
                <ul class="dropdown-menu menu-contact">
                    <li><a href="#instagram">Instagram</a></li>
                    <li><a href="#facebook">Facebook</a></li>
                    <li><a href="#telegram">Telegram</a></li>
                    <li><a href="#whatsapp">WhatsApp</a></li>
                </ul>
            </div>
        </div>
        <main></main>
        <footer>
            <p>Copyright 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
