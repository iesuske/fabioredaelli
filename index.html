<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face { font-family: 'Lobster Regular'; src: url('fonts/lobsteregular.ttf') format('truetype'); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow-x: hidden; background-color: #fceecb; }

        /* --- LOGICA DI BASE (Desktop Invariata) --- */
        .bg-artwork { position: absolute; inset: 0; background-image: url('images/bg2.jpg'); background-size: cover; background-position: center 18%; background-repeat: no-repeat; z-index: 1; }
        .content-overlay { position: relative; z-index: 2; width: 100%; height: 100%; }
        header { width: 100%; margin-top: 52px; display: flex; justify-content: center; }
        .brand-title { font-family: 'Lobster Regular', cursive; font-size: 3.28rem; text-align: center; white-space: nowrap; text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2); transform: translateY(33px); }
        .sub-nav { width: 100%; margin-top: 42px; display: flex; justify-content: flex-end; gap: calc(3cm - 8px); padding: 0 4%; pointer-events: auto; }
        
        .dropdown { position: relative; display: inline-block; }
        .dropdown-trigger { font-family: 'Lobster Regular', cursive; color: #ffffff; font-size: 1.7rem; cursor: pointer; padding: 10px 15px; text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4); }
        .dropdown-menu { display: none; position: absolute; right: 50%; transform: translateX(50%); top: 100%; margin-top: 2px; background: #000000; border-radius: 20px; list-style: none; z-index: 10; overflow: hidden; }
        .dropdown:hover .dropdown-menu { display: block; }
        .dropdown-menu li a { font-family: 'Lobster Regular', cursive; color: #ffffff; padding: 8px 15px; display: block; font-size: 1.3rem; text-align: center; }
        
        footer { position: fixed; bottom: 0; width: 100%; padding: 15px; text-align: center; color: rgba(255, 255, 255, 0.9); font-size: 0.85rem; background: rgba(13, 27, 42, 0.6); backdrop-filter: blur(4px); }

        /* --- CORREZIONE MOBILE (iPhone) --- */
        @media (max-width: 480px) {
            .bg-artwork { background-size: contain; background-position: center 60%; }
            .brand-title { font-size: 1.8rem; transform: translateY(10px); }
            .sub-nav { justify-content: center; margin-top: 15px; gap: 5px; }
            .dropdown-trigger { font-size: 1.2rem; padding: 5px; }
            footer { font-size: 0.6rem; padding: 5px; }
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <h1 class="brand-title">
                <span style="color:#ffffff;">Fabio</span> <span style="color:#000000;">Hot Stuff</span> <span style="color:#ffffff;">Redaelli</span>
            </h1>
        </header>

        <div class="sub-nav">
            <div class="dropdown">
                <a class="dropdown-trigger">About Me</a>
                <ul class="dropdown-menu"><li><a href="#about">Sono Fabio</a></li></ul>
            </div>
            <div class="dropdown">
                <a class="dropdown-trigger">Contact Me</a>
                <ul class="dropdown-menu">
                    <li><a href="#insta">Instagram</a></li>
                    <li><a href="#fb">Facebook</a></li>
                </ul>
            </div>
        </div>

        <footer>
            <p>© 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
