<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>

<link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

<style>
@font-face{font-family:'Lobster Regular';src:url('fonts/lobsteregular.ttf') format('truetype');font-display:block}

:root{--f:'Lobster Regular',cursive;--red:#b72216;--cream:#fde3b8}

.testo-custom{visibility:hidden;opacity:0}
body.fonts-loaded .testo-custom{visibility:visible;opacity:1;transition:opacity .3s ease-in}

*{box-sizing:border-box;margin:0;padding:0;-webkit-user-drag:none;touch-action:manipulation}
img,a,button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

/* ELIMINAZIONE DEL SCROLL DELLA PAGINA */
html,body{width:100%;height:100vh;height:100dvh;background:var(--cream);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden}

.close-red-btn{position:absolute;top:10px;right:10px;width:24px;height:24px;background:var(--red);color:#fff;border:0;border-radius:50%;font:bold 15px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#close-zoom{position:fixed;top:10px;right:10px;z-index:1000000}

#landscape-warning{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:var(--cream);z-index:999999;flex-direction:column;align-items:center;overflow:hidden}
.landscape-top-bar{width:100%;background:var(--red);border-bottom:2px solid #000;padding:4px 0 0;text-align:center;flex-shrink:0}
body.mobile-chrome .landscape-top-bar{padding-top:12px}
.landscape-top-bar h1{font-family:var(--f);font-size:4vw;color:#fff;margin-bottom:-5px;font-weight:400;line-height:1}
body.mobile-chrome .landscape-top-bar h1{font-size:4.5vw}
.text-black{color:#000}
.landscape-text-container{width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;padding:6.5vh 10px 0;font-family:var(--f);flex:1}
.landscape-text-container h2{font-size:14vh;font-weight:400;margin-bottom:8px;color:var(--red)}
.landscape-text-container p{font-size:7vh;line-height:1.2;color:#000;white-space:nowrap}
@media screen and (max-height:500px) and (orientation:landscape){#landscape-warning{display:flex}}

.master-canvas{position:relative;width:100%;margin-top:-50px}
.image-wrapper{position:relative;width:100%;max-width:100%;display:block}
.bg-image{width:100%;height:auto;display:block}

/* LIVELLO SVG RESPONSIVE PER AREE SENSIBILI E FARI */
.curiosity-svg-overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:250;
  pointer-events:none;
}
.balloon-poly-hotspot{
  cursor:pointer;
  pointer-events:auto;
  fill: transparent;
  stroke: none;
}

/* DISSOLVENZA E FARI INTENSI */
.headlight-glow, .headlight-beam{
  opacity: 0;
  transition: opacity 0.6s ease-in-out;
  pointer-events: none;
}

.headlight-glow{
  fill: rgba(255, 245, 150, 0.98);
  mix-blend-mode: overlay;
}

.headlight-beam{
  fill: url(#beam-gradient);
  mix-blend-mode: color-dodge;
  filter: url(#soft-blur);
}

.headlights-active .headlight-glow,
.headlights-active .headlight-beam{
  opacity: 0.95;
}

.dropdown{position:relative;display:inline-flex;align-items:center}

.dropdown-menu{
  display:none;
  position:fixed;
  top:14.8vh;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-radius:16px;
  overflow:hidden;
  list-style:none;
  z-index:1000;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
  font-family:var(--f);
  color:#fff;
}
.dropdown.active:not(.modal-open) .dropdown-menu{display:block}
.dropdown-menu li{font-size:1.3rem;line-height:1.3;white-space:nowrap}
.close-li{display:block}

/* PADDING VERTICALE SIMMETRICO PER IL MENU CONTACT */
.menu-contact{width:220px;padding:15px 2px 15px}

.menu-about{
  width:90vw;
  max-width:680px;
  padding:32px 28px 24px;
  max-height:68vh;
  overflow-y:auto;
}

.menu-about::-webkit-scrollbar{width:3px}
.menu-about::-webkit-scrollbar-track{background:transparent}
.menu-about::-webkit-scrollbar-thumb{background-color:transparent;border-radius:10px;transition:background-color .4s ease}
.menu-about.show-scrollbar{scrollbar-color:rgba(255,255,255,.6) transparent}
.menu-about.show-scrollbar::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.6)}

.bio-title{
  font-weight:bold;
  font-size:1.4rem;
  margin-bottom:12px;
  text-align:center;
  color:#fff;
}

.bio-text{
  font-size:1.15rem;
  line-height:1.45;
  text-align:justify;
  text-justify:inter-word;
  white-space:normal;
}

.menu-contact li a{
  color:#fff;
  display:block;
  text-decoration:none;
  padding:10px 6px;
  margin:2px 0px;
  border-radius:6px;
  transition:background .2s, color .2s;
  text-align:center;
  cursor:pointer;
}
.menu-contact li a:hover{
  background:var(--red);
}

.curiosity-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:99999;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding-top:14.8vh;
  overflow-y:auto;
  pointer-events:none;
}
.curiosity-overlay.open{display:flex}
.curiosity-modal{
  position:relative;
  background:rgba(18,18,18,.95);
  border:1px solid rgba(255,255,255,.15);
  border-radius:16px;
  width:90vw;
  max-width:680px;
  max-height:70vh;
  overflow-y:auto;
  padding:28px 20px 16px;
  box-shadow:0 20px 50px rgba(0,0,0,.8);
  display:flex;
  flex-direction:column;
  gap:12px;
  scrollbar-width:none;
  pointer-events:auto;
  font-family:var(--f);
}
.curiosity-modal::-webkit-scrollbar{display:none}

.video-container,.works-image-container{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}
.video-container{border-radius:10px;background:#000}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.works-image-container{border-radius:8px;box-shadow:0 15px 40px rgba(0,0,0,.8);cursor:zoom-in}
.works-image-container img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;border:2px solid rgba(255,255,255,.85);border-radius:6px;cursor:zoom-in;z-index:1}
.works-image-container::after,.zoom-container::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;border-radius:6px;pointer-events:none;box-shadow:inset 0 0 55px rgba(0,0,0,.65);background:radial-gradient(circle,rgba(0,0,0,0) 50%,rgba(0,0,0,.35) 100%);z-index:2}

.curiosity-text{color:#fff;text-align:center}
.curiosity-text h3,.curiosity-text p{letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curiosity-text h3{color:var(--cream);font-size:1.8rem;margin-bottom:4px;font-weight:400}
.curiosity-text p{font-size:1.15rem;line-height:1.4;color:#e0e0e0}
.curiosity-footer{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:8px 0;border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2)}
.video-counter{color:var(--cream);font-size:1.15rem;letter-spacing:.5px}
.nav-buttons{display:flex;gap:16px;margin-left:auto;align-items:center}
.curiosity-nav-btn{font-family:inherit;font-size:1.25rem;background:transparent;border:0;padding:0 4px;cursor:pointer;transition:color .2s;white-space:nowrap;color:#fff}
.curiosity-nav-btn.active-nav{color:var(--red)}
.curiosity-nav-btn:hover{opacity:.85}

.zoom-overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;background:rgba(0,0,0,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:
