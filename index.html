<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    
    <link rel="icon" type="image/png" href="images/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="shortcut icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="preload" href="fonts/lobsteregular.ttf" as="font" type="font/ttf" crossorigin>

    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        /* GESTIONE FONT CARICATO */
        .testo-custom { visibility: hidden; opacity: 0; }
        body.fonts-loaded .testo-custom { 
            visibility: visible; 
            opacity: 1; 
            transition: opacity 0.3s ease-in; 
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: #fde3b8; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* ELIMINA LO SCROLL SU DESKTOP */
        }

        /* =======================================================
           STRUTTURA GRAFICA DESKTOP
           ======================================================= */
        .master-canvas {
            position: relative;
            width: 100%;
            background-color: #fde3b8;
            margin-top: -50px;
        }

        .bg-image {
            width: 100%;
            height: auto;
            display: block; 
        }

        .text-layer {
            position: absolute;
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%;
            pointer-events: none; 
        }

        .header-anchor {
            position: absolute;
            top: 7.6%; 
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: auto; 
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.8vw; 
            line-height: 1;
            white-space: nowrap; 
            margin: 0;
            text-shadow: none;
            text-rendering: optimizeLegibility;
            font-variant-ligatures: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transform: translateY(2px);
        }

        @supports (-webkit-hyphens:none) {
            .brand-title {
                transform: translateY(3.2px);
            }
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        .menus-container {
            display: flex;
            gap: 5.5vw; 
            margin-left: 45.5%; 
            margin-top: 0.8vw; 
            align-items: center;
        }

        /* STILE TASTO WORKS! DESKTOP */
        .btn-works {
            font-family: 'Lobster Regular', cursive;
            font-size: 1.5vw;
            color: #ffffff;
            background-color: #b72216;
            padding: 1px 10px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease, color 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .btn-works:hover {
            background-color: #ffffff;
            color: #000000; 
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            font-size: 1.5vw; 
            color: #ffffff;
            cursor: pointer;
            text-decoration: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            transition: color 0.2s ease;
            display: inline-block;
        }

        .dropdown:hover .dropdown-trigger { color: #000000; }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 12px;
            list-style: none;
            padding: 0; 
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
        }

        .dropdown-menu::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 12px;
        }

        .menu-about { 
            left: 50%;
            transform: translateX(-50%);
            text-align: center; 
            width: max-content;
            padding: 10px 0 18px 0; 
        }

        .menu-contact { 
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% + 40px);
            text-align: center; 
        }

        .dropdown:hover .dropdown-menu { display: block; }

        .dropdown-menu li {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff;
            font-size: 1.3rem;
            line-height: 1.3;
            white-space: nowrap;
        }

        .menu-about li {
            text-align: center;
            padding: 6px 18px;
            width: 100%;
        }

        .menu-contact li a {
            color: #ffffff;
            display: block;
            text-decoration: none;
            padding: 10px 12px;
            transition: background 0.2s ease;
            text-align: center;
            cursor: pointer;
            width: 100%;
        }

        .menu-contact li a:hover { background: #b72216; }

        .menu-contact li:first-child a {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .menu-contact li:last-child a {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px;
            text-align: center;
            background: rgba(13, 27, 42, 0.95);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 0.7rem;
            z-index: 1000;
        }

        /* =======================================================
           OTTIMIZZAZIONE MOBILE
           ======================================================= */
        @media screen and (max-width: 768px) {
            html, body {
                height: auto;
                min-height: 100dvh;
                overflow-y: auto;
            }

            .master-canvas {
                margin-top: -10.5px;
                overflow: hidden;
            }

            .bg-image {
                width: calc(165% + 133px); /* Aumentato di altri 30 pixel (totale +133px) */
                max-width: none;
                margin-left: calc(-35% - 43px);
                -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 98%);
                mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 98%);
            }

            .header-anchor {
                position: absolute;
                top: 7.2%; 
                left: 0;
                width: 100%;
                padding: 0 10px;
                background: transparent !important;
                border: none !important;
            }

            .brand-title {
                font-size: calc(6.2vw + 1px);
                white-space: normal;
                line-height: 1.1;
                transform: translateY(1px) !important; 
                text-align: center;
            }

            .menus-container {
                margin-left: 0 !important;
                margin-top: 2vw;
                justify-content: center;
                gap: 4vw;
            }

            .btn-works {
                font-size: 3.5vw; 
                padding: 1px 8px;
                border-radius: 6px;
                transform: none !important;
            }

            .dropdown-trigger {
                font-size: 3.5vw; 
            }

            .dropdown-menu {
                position: fixed;
                left: 50% !important;
                transform: translateX(-50%) !important;
                width: 90vw !important;
                max-height: 50vh;
                overflow-y: auto;
                border-radius: 10px;
                padding: 5px 0;
            }

            .menu-about li {
                font-size: 0.9rem;
                white-space: normal;
                padding: 8px 12px;
            }

            .menu-contact li a {
                font-size: 1rem;
                padding: 10px;
            }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.fonts.ready.then(function() {
                document.body.classList.add('fonts-loaded');
            });
        });
    </script>
</head>

    <div class="master-canvas">
        <img src="images
