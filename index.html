<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fabio Hot Stuff Redaelli</title>
  <style>
    /* Reset di base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
    }

    /* --- Overlay di blocco in modalità Landscape --- */
    .landscape-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
    }

    /* Banda rossa di sfondo (invariata) */
    .landscape-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #ff0000;
    }

    /* Blocco scritta e menu (spostato di 3px più in alto) */
    .landscape-text-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 3px));
      text-align: center;
      color: #ffffff;
      width: 90%;
      max-width: 500px;
    }

    .landscape-text-container h2 {
      font-size: 1.4rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .landscape-text-container p {
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* Menu interno all'overlay */
    .landscape-menu {
      display: flex;
      justify-content: center;
      gap: 15px;
      list-style: none;
    }

    .landscape-menu a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .landscape-menu a:hover {
      text-decoration: underline;
    }

    /* Attivazione overlay solo in orientamento orizzontale su dispositivi mobili/tablet */
    @media screen and (max-width: 900px) and (orientation: landscape) {
      .landscape-overlay {
        display: block;
      }
      body {
        overflow: hidden;
      }
    }

    /* --- Layout principale del sito --- */
    header {
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
    }

    main {
      padding: 40px 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Overlay visibile solo in orizzontale su mobile -->
  <div class="landscape-overlay">
    <div class="landscape-top-bar"></div>

    <div class="landscape-text-container">
      <h2>Dispositivo orizzontale</h2>
      <p>Per la corretta visualizzazione del sito girare il dispositivo in verticale.</p>

      <ul class="landscape-menu">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">Chi Sono</a></li>
        <li><a href="#contact">Contatti</a></li>
      </ul>
    </div>
  </div>

  <!-- Intestazione del sito -->
  <header>
    <div class="logo">Fabio Hot Stuff Redaelli</div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">Chi Sono</a></li>
        <li><a href="#contact">Contatti</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenuto della pagina -->
  <main>
    <h1>Fabio Hot Stuff Redaelli</h1>
    <p>Contenuto del sito visibile correttamente in modalità verticale.</p>
  </main>

</body>
</html>
