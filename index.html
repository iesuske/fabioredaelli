<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Layout Desktop vs Mobile</title>
    <style>
        /* --- STILI BASE (Validi per tutti i dispositivi) --- */
        body {
            font-family: sans-serif;
            padding: 50px;
            background-color: #f0f0f0;
        }

        .contenitore {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        /* --- VISUALIZZAZIONE DESKTOP (Monitor iMac, Laptop) --- */
        @media screen and (min-width: 769px) {
            .messaggio-rotazione {
                /* Nasconde sempre il messaggio fastidioso su computer */
                display: none; 
            }
            .blocco-da-modificare {
                /* Stile normale per il desktop, non va in alto e non è forzato su una riga */
                display: block; 
                margin-top: 0;
            }
        }

        /* --- VISUALIZZAZIONE MOBILE (Smartphone fino a 768px) --- */
        @media screen and (max-width: 768px) {
            .messaggio-rotazione {
                /* Togli "Per favore rivolta il tuo dispositivo" */
                display: none; 
            }

            .blocco-da-modificare {
                /* Metti tutto su una riga */
                display: flex;
                flex-direction: row;
                white-space: nowrap;
                gap: 15px; /* Spazio tra gli elementi sulla stessa riga */
                
                /* Porta il blocco un po' più in alto */
                transform: translateY(-30px); 
                /* In alternativa puoi usare: margin-top: -30px; */
            }
        }
    </style>
</head>
<body>

    <div class="contenitore">
        <!-- Questo è il messaggio che ti dava fastidio -->
        <div class="messaggio-rotazione">
            <strong>Per favore rivolta il tuo dispositivo</strong>
        </div>

        <!-- Questo è il blocco che volevi su una riga e spostato in alto -->
        <div class="blocco-da-modificare">
            <span>🔴 Elemento 1</span>
            <span>🟢 Elemento 2</span>
            <span>🔵 Elemento 3</span>
        </div>
        
        <p>Altro testo della pagina che rimane al suo posto...</p>
    </div>

</body>
</html>
