<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; /* Blocca lo scroll per mantenere la vista perfetta */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fceecb;
        }

        .bg-artwork {
            position: absolute;
            inset: 0;
            background-image: url('images/bg2.jpg');
            background-size: contain; /* L'auto ora rientra nello schermo */
            background-position: bottom center; 
            background-repeat: no-repeat;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            pointer-events: none;
        }

        header {
            width: 100%;
            margin-top: 20px; 
            pointer-events: auto;
            text-align: center;
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 1.8rem; /* Rimpicciolito per iPhone */
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        .sub-nav {
            width: 100%;
            margin-top: 15px;
            display: flex; justify-content: center;
            gap: 15px; 
            pointer-events: auto;
        }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            font-size: 1.2rem;
            text-decoration: none; cursor: pointer;
            padding: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 10px;
            text-align: center;
            color: #ffffff;
            font-size: 0.65rem; 
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
        }

        /* Nessuna modifica necessaria ai dropdown esistenti */
        .dropdown-menu { display: none; position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 10px; z-index: 10; }
        .dropdown:hover .dropdown-menu { display: block; }
        .dropdown-menu li a { font-family: 'Lobster Regular'; color: #fff; padding: 5px 10px; font-size: 0.9rem; text-decoration: none; display: block; }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <h1 class="brand-title">
                <span class="text-white">Fabio</span> <span class="text-black">Hot Stuff</span> <span class="text-white">Redaelli</span>
            </h1>
        </header>

        <div class="sub-nav">
            <div class="dropdown">
                <a class="dropdown-trigger">About Me</a>
                <ul class="dropdown-menu"><li><a href="#about">Comic Artist</a></li></ul>
            </div>
            <div class="dropdown">
                <a class="dropdown-trigger">Contact</a>
                <ul class="dropdown-menu"><li><a href="#social">Social</a></li></ul>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
