<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Hot Stuff Redaelli - Comic Art Author -</title>
    <style>
        @font-face {
            font-family: 'Lobster Regular';
            src: url('fonts/lobsteregular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fceecb;
        }

        .bg-artwork {
            position: absolute;
            inset: 0;
            background-image: url('images/bg2.jpg');
            background-size: cover;
            background-position: center 18%; 
            background-repeat: no-repeat;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            pointer-events: none;
        }

        header {
            width: 100%;
            margin-top: 52px; 
            padding: 0 4%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
        }

        .brand-title {
            font-family: 'Lobster Regular', cursive;
            font-size: 3.28rem;
            text-align: center;
            white-space: nowrap;
            line-height: 1.2;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
            transform: translateY(33px); 
        }

        .text-white { color: #ffffff; }
        .text-black { color: #000000; }

        .sub-nav {
            width: 100%;
            padding: 0 4%;
            margin-top: 42px; /* Ripristinato margine verticale */
            display: flex; justify-content: flex-end; 
            gap: calc(3cm - 8px); /* Avvicinati in orizzontale di 8px */
            pointer-events: auto;
        }

        .dropdown { position: relative; display: inline-block; }

        .dropdown-trigger {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            font-size: 1.7rem; /* Ripristinato font originale */
            text-decoration: none; cursor: pointer;
            padding: 10px 15px;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .contact-trigger { font-size: 1.6rem; }

        .dropdown:hover .dropdown-trigger { color: #b72216; }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 50%; transform: translateX(50%); 
            top: 100%; margin-top: 2px; 
            background: #000000; 
            box-shadow: 0px 12px 32px rgba(0,0,0,0.55);
            border-radius: 20px; 
            border: none;
            list-style: none;
            padding: 0; 
            z-index: 10;
            overflow: hidden; 
        }

        .menu-about { min-width: 245px; }
        .menu-contact { min-width: 150px; } 

        .dropdown-menu li { width: 100%; }

        .dropdown-menu li a {
            font-family: 'Lobster Regular', cursive;
            color: #ffffff; 
            padding: 8px 15px; 
            text-decoration: none;
            display: block;
            width: 100%;
            font-size: 1.3rem; 
            text-align: center; 
            transition: background-color 0.1s ease;
        }

        .dropdown-menu li a:hover {
            background: #b72216;
            color: #ffffff;
        }

        .dropdown:hover .dropdown-menu { display: block; }

        main { flex-grow: 1; pointer-events: none; }

        footer {
            padding: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem; pointer-events: auto;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(4px);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* =====================================================
           RESPONSIVE OVERRIDES — iPad / tablet (≤1024px)
           Il desktop sopra resta invariato. Su tablet portrait
           lo sfondo cover taglia troppo: passiamo a un layout
           a blocchi (header rosso solido + artwork contain).
           ===================================================== */
        @media (max-width: 1024px) {
            html, body {
                height: auto;
                overflow-x: hidden;
                overflow-y: auto;
                background-color: #fceecb;
            }

            .bg-artwork {
                position: relative;
                inset: auto;
                width: 100%;
                height: 60vh;
                background-size: contain;
                background-position: center center;
                background-color: #fceecb;
            }

            .content-overlay {
                position: static;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                pointer-events: auto;
            }

            header {
                order: 1;
                margin-top: 0;
                padding: 22px 4% 10px;
                background: #b72216;
                justify-content: center;
            }

            .sub-nav {
                order: 2;
                margin-top: 0;
                padding: 0 4% 16px;
                background: #b72216;
                justify-content: center;
                gap: 40px;
                border-bottom: 4px solid #7a1710;
            }

            main {
                order: 3;
                flex-grow: 1;
                display: flex;
                align-items: stretch;
                pointer-events: auto;
            }

            main .bg-artwork-slot { width: 100%; }

            footer { order: 4; }

            .brand-title {
                font-size: 2.4rem;
                transform: none;
                white-space: normal;
                line-height: 1.15;
            }
        }

        /* =====================================================
           RESPONSIVE OVERRIDES — iPhone / mobile (≤480px)
           ===================================================== */
        @media (max-width: 480px) {
            /* Layout a blocchi verticali: header rosso solido con titolo,
               poi barra nav rossa, poi l'illustrazione mostrata intera
               (contain) e footer in fondo. La pagina è scrollabile. */
            .bg-artwork {
                height: 55vh;
                min-height: 320px;
            }

            header {
                padding: 16px 4% 6px;
            }

            .brand-title {
                font-size: 1.65rem;
                white-space: normal;
                line-height: 1.2;
                transform: none;
            }

            .sub-nav {
                gap: 22px;
                padding: 0 4% 12px;
                flex-wrap: wrap;
            }

            .dropdown-trigger {
                font-size: 1.15rem;
                padding: 4px 6px;
            }

            .contact-trigger { font-size: 1.1rem; }

            .dropdown-menu {
                min-width: 190px;
                max-width: 90vw;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
            }

            .menu-about { min-width: 200px; }
            .menu-contact { min-width: 140px; }

            .dropdown-menu li a {
                font-size: 1rem;
                padding: 10px 12px;
            }

            footer {
                font-size: 0.72rem;
                padding: 10px 12px;
                line-height: 1.35;
            }
        }


        @media (max-width: 1024px) {
            .bg-artwork { display: none !important; }
            main {
                background-image: url('images/bg2.jpg');
                background-size: contain;
                background-position: center center;
                background-repeat: no-repeat;
                background-color: #fceecb;
                min-height: 55vh;
            }
        }
        @media (max-width: 360px) {
            .brand-title { font-size: 1.35rem; }
            .sub-nav { gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header>
            <h1 class="brand-title">
                <span class="text-white">Fabio</span>&nbsp;<span class="text-black">Hot Stuff</span>&nbsp;<span class="text-white">Redaelli</span>
            </h1>
        </header>

        <div class="sub-nav">
            <div class="dropdown">
                <a class="dropdown-trigger">About Me</a>
                <ul class="dropdown-menu menu-about">
                    <li><a href="#about">Sono Fabio Redaelli,<br>appassionato di Rock’n’Roll e arte</a></li>
                </ul>
            </div>

            <div class="dropdown">
                <a class="dropdown-trigger contact-trigger">Contact Me</a>
                <ul class="dropdown-menu menu-contact">
                    <li><a href="#instagram">Instagram</a></li>
                    <li><a href="#facebook">Facebook</a></li>
                    <li><a href="#telegram">Telegram</a></li>
                    <li><a href="#whatsapp">WhatsApp</a></li>
                </ul>
            </div>
        </div>
        <main></main>
        <footer>
            <p>Copyright 2026 Fabio Redaelli - Comic Art Author. Tutti i diritti riservati.</p>
        </footer>
    </div>
</body>
</html>
