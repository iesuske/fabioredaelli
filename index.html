<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabio Redaelli - Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #fceecb; }

        .bg-artwork {
            position: absolute;
            inset: 0;
            background-image: url('images/bg2.jpg');
            background-size: cover; /* Riempie a filo */
            background-position: center;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px;
        }

        .brand-title {
            font-family: sans-serif; /* Sostituisci con il tuo font */
            font-size: 1.8rem;
            text-align: center;
            margin-top: 10px;
        }

        .sub-nav {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .menu-link {
            font-size: 1.2rem;
            text-decoration: none;
            color: #b72216;
            font-weight: bold;
        }

        footer {
            position: absolute;
            bottom: 5px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="bg-artwork"></div>
    <div class="content-overlay">
        <header class="brand-title">
            Fabio Hot Stuff Redaelli
        </header>

        <nav class="sub-nav">
            <a href="#" class="menu-link">About Me</a>
            <a href="#" class="menu-link">Contact</a>
        </nav>

        <footer>
            &copy; 2026 Fabio Redaelli. Tutti i diritti riservati.
        </footer>
    </div>
</body>
</html>
